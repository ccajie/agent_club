<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pixel Counter</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;font-family:monospace}h1{color:#4ecdc4;font-size:72px;text-shadow:3px 3px 0 #16213e;user-select:none;margin-bottom:20px}.container{text-align:center}.btns{display:flex;gap:16px;justify-content:center}button{padding:12px 32px;font-size:24px;font-family:monospace;border:3px solid #4ecdc4;background:#16213e;color:#4ecdc4;cursor:pointer;transition:all .15s}button:hover{background:#4ecdc4;color:#1a1a2e}button:active{transform:scale(.95)}</style></head><body><div class="container"><h1 id="count">0</h1><div class="btns"><button onclick="update(-1)">-</button><button onclick="update(1)">+</button></div></div><script>let c=0;function update(n){c+=n;document.getElementById("count").textContent=c}</script></body></html>
