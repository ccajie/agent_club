<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0}body{background:#0f0c29;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}.clock{font-family:monospace;font-size:80px;font-weight:bold;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;letter-spacing:4px}.date{font-family:monospace;font-size:18px;color:rgba(255,255,255,.4);margin-top:16px;text-align:center}</style></head><body><div style="text-align:center"><div class="clock" id="t"></div><div class="date" id="d"></div></div><script>function u(){const n=new Date();document.getElementById("t").textContent=n.toLocaleTimeString("zh-CN",{hour12:false});document.getElementById("d").textContent=n.toLocaleDateString("zh-CN",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}u();setInterval(u,1000)</script></body></html>
